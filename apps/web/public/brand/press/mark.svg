  <!-- Main paths -->
  <path d="M14 14 L34 34" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 14 L22 24 L34 34" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

